blueprint:
  name: Aerosmart PV-Überschuss (SG-Box-Ersatz)
  description: >
    Speichert PV-Überschuss als Wärme – wie die Smart-Grid-Funktion der
    drexel-und-weiss SG-Box, nur mit einem Netz- oder Einspeise-Sensor aus
    Home Assistant statt dem Kontakt des Wechselrichters.


    **Überschuss** (Einspeisung über Leistungsaufnahme der Wärmepumpe plus
    Mindest-Einspeisung, oder optional Niedertarif): liegt der Boiler unter
    der Starttemperatur, wird Brauchwasser-Soll auf die Ladetemperatur
    gesetzt (SG-Box: 55 °C ab unter 52 °C). Optional wird Raum-Soll
    angehoben (SG-Box: 0,5–3 K).

    **Kein Überschuss mehr** (Einspeisung unter der Mindest-Einspeisung):
    die vorherigen Sollwerte werden wiederhergestellt. Hat jemand den
    Sollwert in der Zwischenzeit geändert, bleibt dessen Wert stehen.


    Die vorherigen Sollwerte werden in Helfern gespeichert, damit sie einen
    Neustart überstehen. Vorher unter Einstellungen → Geräte & Dienste →
    Helfer je einen **Zahlenwert-Helfer** anlegen: Minimum 0, Maximum 100,
    Schrittweite 0,1, Anzeigemodus Eingabefeld. Einen für Brauchwasser und –
    falls Raum genutzt wird – einen für Raum. 0 bedeutet „keine Anhebung
    aktiv“.
  domain: automation
  source_url: https://github.com/kocher/ha-drexel-weiss-fernwartungsmodul/blob/main/blueprints/automation/drexel/pv_ueberschuss.yaml
  homeassistant:
    min_version: 2024.8.0
  input:
    surplus:
      name: Überschuss
      description: Wann gilt Strom als übrig?
      input:
        export_sensor:
          name: Netz- oder Einspeise-Sensor
          description: >
            Leistung am Netzanschluss in W, z. B. vom Smart Meter oder
            Wechselrichter. Wie das Vorzeichen zu lesen ist, legt „Einspeisung
            ist“ fest.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        export_sign:
          name: Einspeisung ist
          description: >
            Positiv bei einem reinen Einspeise-Sensor (0 bei Netzbezug).
            Negativ bei einem Netz-Sensor, der Bezug positiv und Einspeisung
            negativ anzeigt.
          default: "1"
          selector:
            select:
              options:
                - label: positiv (Einspeise-Sensor)
                  value: "1"
                - label: negativ (Netz-Sensor, Bezug positiv)
                  value: "-1"
        heat_pump_power:
          name: Leistungsaufnahme Wärmepumpe
          description: >
            Was die Wärmepumpe beim Heizen ungefähr aufnimmt, samt
            Ventilatoren. Angehoben wird erst, wenn so viel plus die
            Mindest-Einspeisung eingespeist wird – dann läuft die Wärmepumpe
            mit eigenem Strom.
            Vorgabe 500 W passt zur aerosmart m: max. 450 W laut Datenblatt,
            dazu die Ventilatoren.
          default: 500
          selector:
            number:
              min: 0
              max: 10000
              step: 10
              unit_of_measurement: W
              mode: box
        reserve:
          name: Mindest-Einspeisung
          description: >
            So viel soll trotz laufender Wärmepumpe noch eingespeist werden.
            Angehoben wird ab Leistungsaufnahme plus Mindest-Einspeisung,
            zurückgesetzt, sobald weniger als die Mindest-Einspeisung
            eingespeist wird. Ob die Wärmepumpe gerade läuft, wird dabei nicht
            geprüft. Mit einem Batteriespeicher, der das Netz bei null hält,
            nicht zu klein wählen – sonst versorgt er die Anhebung weiter.
          default: 300
          selector:
            number:
              min: 100
              max: 10000
              step: 10
              unit_of_measurement: W
              mode: box
        on_delay:
          name: Einschaltverzögerung
          description: >
            So lange muss die Einspeisung ununterbrochen über
            Leistungsaufnahme plus Mindest-Einspeisung liegen, bevor angehoben
            wird – auch wenn der Boiler während des Überschusses abkühlt oder
            Home Assistant neu startet.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: min
        off_delay:
          name: Ausschaltverzögerung
          description: >
            So lange muss die Einspeisung ununterbrochen unter der
            Mindest-Einspeisung liegen, bevor die Sollwerte zurückgesetzt werden. Bei Wolken nicht
            zu kurz wählen.
          default: 15
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: min
        cheap_rate:
          name: Niedertarif (optional)
          description: >
            Ist diese Entität „an“, wird wie bei Überschuss angehoben
            (SG-Box-Eingang „Smart Meter“), bei „aus“ zurückgesetzt. Leer
            lassen, wenn nicht vorhanden.
          default: ""
          selector:
            entity:
              filter:
                - domain: [binary_sensor, input_boolean, switch]
    water:
      name: Brauchwasser
      description: Boiler mit Überschuss aufheizen.
      input:
        water_heater:
          name: Brauchwasser
          description: Die Brauchwasser-Entität der Aerosmart (Wärmepumpe).
          selector:
            entity:
              filter:
                - domain: water_heater
                  integration: drexel
        water_helper:
          name: Helfer für den vorherigen Brauchwasser-Soll
          description: >
            Zahlenwert-Helfer (0–100, Schrittweite 0,1), in dem der
            Brauchwasser-Soll vor der Anhebung gespeichert wird. Nicht von Hand
            ändern; 0 heißt „keine Anhebung aktiv“.
          selector:
            entity:
              filter:
                - domain: input_number
        boost_temperature:
          name: Ladetemperatur
          description: >
            Auf diesen Brauchwasser-Soll wird bei Überschuss angehoben.
            SG-Box: 55 °C, das Maximum der Aerosmart.
          default: 55
          selector:
            number:
              min: 40
              max: 55
              unit_of_measurement: °C
        start_below:
          name: Starttemperatur
          description: >
            Nur anheben, wenn der Boiler kälter ist – sonst lohnt die Ladung
            nicht. SG-Box: 52 °C.
          default: 52
          selector:
            number:
              min: 30
              max: 55
              unit_of_measurement: °C
    room:
      name: Raum (optional)
      description: Zusätzlich Wärme im Haus speichern.
      collapsed: true
      input:
        climate:
          name: Raum
          description: >
            Die Raum-Entität der Aerosmart (Raumbediengerät). Leer lassen, um
            Raum-Soll nicht anzuheben.
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
                  integration: drexel
        room_helper:
          name: Helfer für den vorherigen Raum-Soll
          description: >
            Zahlenwert-Helfer (0–100, Schrittweite 0,1), in dem der Raum-Soll
            vor der Anhebung gespeichert wird. Nur nötig, wenn Raum gewählt
            ist.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_number
        room_raise:
          name: Anhebung
          description: >
            Um so viel wird Raum-Soll bei Überschuss erhöht, höchstens bis zum
            Maximum des Geräts. SG-Box: 0,5–3 K.
          default: 1
          selector:
            number:
              min: 0.5
              max: 3
              step: 0.5
              unit_of_measurement: K
        room_conditions:
          name: Bedingungen für Raum
          description: >
            Raum-Soll nur anheben, wenn alle diese Bedingungen erfüllt sind,
            z. B. Heizperiode, Außentemperatur unter 15 °C oder Fenster
            geschlossen. Brauchwasser wird davon nicht beeinflusst. Das
            Zurücksetzen prüft sie nicht. Werden sie während eines
            Überschusses erfüllt, wird beim nächsten Auslöser angehoben. Leer
            lassen für keine Einschränkung.
          default: []
          selector:
            condition: {}
    conditions:
      name: Zusätzliche Bedingungen (optional)
      description: Nur anheben, wenn diese Bedingungen erfüllt sind.
      collapsed: true
      input:
        raise_conditions:
          name: Bedingungen
          description: >
            Alle müssen erfüllt sein, damit angehoben wird, z. B. „Fenster
            geschlossen“, „jemand zu Hause“ oder ein Schalter, der die
            Automation pausiert. Das Zurücksetzen prüft sie nicht – eine
            Anhebung wird also immer beendet. Werden die Bedingungen während
            eines Überschusses erfüllt, wird beim nächsten Auslöser angehoben
            (Überschuss beginnt, Boiler kühlt unter die Starttemperatur,
            Neustart). Leer lassen für keine Einschränkung.
          default: []
          selector:
            condition: {}
    notification:
      name: Benachrichtigung (optional)
      description: Bescheid geben, wenn angehoben oder zurückgesetzt wird.
      collapsed: true
      input:
        notify_action:
          name: Benachrichtigung
          description: >
            Aktionen, die beim Anheben und Zurücksetzen ausgeführt werden.
            Vorbelegt ist eine Benachrichtigung in Home Assistant; über „⋮ →
            Aktion ändern“ z. B. das Telefon (`notify.mobile_app_…`) wählen.
            Titel und Nachricht stehen als `{{ title }}` und `{{ message }}`
            bereit – die Nachricht enthält Einspeisung, aktuelle Temperatur und
            Sollwerte. Alle Aktionen löschen für keine Benachrichtigung.
          default:
            - action: notify.persistent_notification
              data:
                title: "{{ title }}"
                message: "{{ message }}"
          selector:
            action: {}

mode: queued
max_exceeded: silent

trigger_variables:
  cheap_rate: !input cheap_rate
  export_sign: !input export_sign
  heat_pump_power: !input heat_pump_power

trigger:
  # Export as a positive number, whatever the sensor's sign convention.
  # Start once the heat pump would still leave the minimum export.
  - platform: numeric_state
    entity_id: !input export_sensor
    value_template: >
      {{ state.state | float(0) * export_sign | int(1)
         - heat_pump_power | float(0) }}
    above: !input reserve
    for:
      minutes: !input on_delay
    id: start
  - platform: template
    value_template: "{{ cheap_rate != '' and is_state(cheap_rate, 'on') }}"
    id: start
  # The boiler cooled down while the surplus continues.
  - platform: numeric_state
    entity_id: !input water_heater
    attribute: current_temperature
    below: !input start_below
    id: delayed
  # Stop below the minimum export; whether the heat pump runs is not checked.
  - platform: numeric_state
    entity_id: !input export_sensor
    value_template: "{{ state.state | float(0) * export_sign | int(1) }}"
    below: !input reserve
    for:
      minutes: !input off_delay
    id: stop
  - platform: template
    value_template: "{{ cheap_rate != '' and is_state(cheap_rate, 'off') }}"
    id: stop
  - platform: homeassistant
    event: start
    id: check

variables:
  export_sensor: !input export_sensor
  reserve: !input reserve
  on_delay: !input on_delay
  water_heater: !input water_heater
  water_helper: !input water_helper
  boost_temperature: !input boost_temperature
  start_below: !input start_below
  climate: !input climate
  room_helper: !input room_helper
  room_raise: !input room_raise
  use_room: "{{ climate != '' and room_helper != '' }}"
  export: "{{ (states(export_sensor) | float(0) * export_sign | int(1)) | round(0) | int }}"
  export_text: >
    {{ 'Einspeisung ' ~ export ~ ' W' if export >= 0
       else 'Netzbezug ' ~ (-export) ~ ' W' }}
  # While raised, the heat pump already uses its share (see triggers).
  raised: >
    {{ states(water_helper) | float(0) > 0
       or (use_room and states(room_helper) | float(0) > 0) }}
  surplus_threshold: >
    {{ reserve if raised else reserve + heat_pump_power | float(0) }}
  surplus: >
    {{ export > surplus_threshold
       or (cheap_rate != '' and is_state(cheap_rate, 'on')) }}
  water_current: "{{ state_attr(water_heater, 'current_temperature') }}"
  water_target: "{{ state_attr(water_heater, 'temperature') | float(0) }}"
  room_current: "{{ state_attr(climate, 'current_temperature') if use_room else none }}"
  room_target: "{{ state_attr(climate, 'temperature') | float(0) if use_room else 0 }}"
  room_max: "{{ state_attr(climate, 'max_temp') | float(26) if use_room else 26 }}"

action:
  - choose:
      - alias: Überschuss – anheben
        conditions:
          - "{{ trigger.id in ['start', 'delayed', 'check'] and surplus }}"
          # Raising only; the reset below ignores them.
          - condition: and
            conditions: !input raise_conditions
        sequence:
          # Boiler cooled down or restart: the surplus has to last for the
          # on delay as well; give up if it ends meanwhile.
          - if:
              - "{{ trigger.id in ['delayed', 'check'] and on_delay | float(0) > 0 }}"
            then:
              - wait_for_trigger:
                  - platform: template
                    value_template: >
                      {{ states(export_sensor) | float(0) * export_sign | int(1) <= surplus_threshold
                         and not (cheap_rate != '' and is_state(cheap_rate, 'on')) }}
                timeout:
                  minutes: "{{ on_delay }}"
                continue_on_timeout: true
              - if:
                  - "{{ wait.trigger is not none }}"
                then:
                  - stop: Überschuss während der Einschaltverzögerung beendet
          - variables:
              export: "{{ (states(export_sensor) | float(0) * export_sign | int(1)) | round(0) | int }}"
              export_text: >
                {{ 'Einspeisung ' ~ export ~ ' W' if export >= 0
                   else 'Netzbezug ' ~ (-export) ~ ' W' }}
          - variables:
              raise_water: >
                {{ states(water_helper) | float(0) == 0
                   and water_current | float(99) < start_below }}
              raise_room: "{{ use_room and states(room_helper) | float(0) == 0 }}"
              room_boost: "{{ [room_target + room_raise, room_max] | min }}"
          - if:
              - "{{ raise_water }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: "{{ water_helper }}"
                data:
                  value: "{{ water_target }}"
              - service: water_heater.set_temperature
                target:
                  entity_id: "{{ water_heater }}"
                data:
                  temperature: "{{ boost_temperature }}"
          - if:
              - "{{ raise_room }}"
              - condition: and
                conditions: !input room_conditions
            then:
              - service: input_number.set_value
                target:
                  entity_id: "{{ room_helper }}"
                data:
                  value: "{{ room_target }}"
              - service: climate.set_temperature
                target:
                  entity_id: "{{ climate }}"
                data:
                  temperature: "{{ room_boost }}"
          # The room conditions may have held raising back.
          - variables:
              room_raised: "{{ raise_room and states(room_helper) | float(0) > 0 }}"
          - if:
              - "{{ raise_water or room_raised }}"
            then:
              - variables:
                  title: Aerosmart – Überschuss
                  message: >
                    {%- set n = '%.1f' -%}
                    {{ export_text }}{{ ', Niedertarif' if cheap_rate != '' and is_state(cheap_rate, 'on') }}.
                    {%- if raise_water %}
                    Brauchwasser {{ (n | format(water_current | float(0))) | replace('.', ',') }} °C,
                    Soll {{ water_target | round(1) | string | replace('.', ',') }} → {{ boost_temperature | round(1) | string | replace('.', ',') }} °C.
                    {%- endif %}
                    {%- if room_raised %}
                    Raum {{ (n | format(room_current | float(0))) | replace('.', ',') }} °C,
                    Soll {{ room_target | round(1) | string | replace('.', ',') }} → {{ room_boost | round(1) | string | replace('.', ',') }} °C.
                    {%- endif %}
              - sequence: !input notify_action
      - alias: Kein Überschuss – zurücksetzen
        conditions:
          - "{{ trigger.id in ['stop', 'check'] and not surplus }}"
        sequence:
          - variables:
              water_before: "{{ states(water_helper) | float(0) }}"
              room_before: "{{ states(room_helper) | float(0) if use_room else 0 }}"
              # Only restore if nobody changed the setpoint meanwhile.
              restore_water: >
                {{ water_before > 0
                   and (water_target - boost_temperature) | abs < 0.1 }}
              restore_room: >
                {{ room_before > 0
                   and (room_target - [room_before + room_raise, room_max] | min) | abs < 0.05 }}
          - if:
              - "{{ restore_water }}"
            then:
              - service: water_heater.set_temperature
                target:
                  entity_id: "{{ water_heater }}"
                data:
                  temperature: "{{ water_before }}"
          - if:
              - "{{ water_before > 0 }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: "{{ water_helper }}"
                data:
                  value: 0
          - if:
              - "{{ restore_room }}"
            then:
              - service: climate.set_temperature
                target:
                  entity_id: "{{ climate }}"
                data:
                  temperature: "{{ room_before }}"
          - if:
              - "{{ room_before > 0 }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: "{{ room_helper }}"
                data:
                  value: 0
          - if:
              - "{{ water_before > 0 or room_before > 0 }}"
            then:
              - variables:
                  title: Aerosmart – kein Überschuss mehr
                  message: >
                    {%- set n = '%.1f' -%}
                    {{ export_text }}.
                    {%- if water_before > 0 %}
                    Brauchwasser {{ (n | format(water_current | float(0))) | replace('.', ',') }} °C,
                    {% if restore_water -%}
                    Soll {{ water_target | round(1) | string | replace('.', ',') }} → {{ water_before | round(1) | string | replace('.', ',') }} °C.
                    {%- else -%}
                    Soll {{ water_target | round(1) | string | replace('.', ',') }} °C bleibt (zwischenzeitlich geändert).
                    {%- endif %}
                    {%- endif %}
                    {%- if room_before > 0 %}
                    Raum {{ (n | format(room_current | float(0))) | replace('.', ',') }} °C,
                    {% if restore_room -%}
                    Soll {{ room_target | round(1) | string | replace('.', ',') }} → {{ room_before | round(1) | string | replace('.', ',') }} °C.
                    {%- else -%}
                    Soll {{ room_target | round(1) | string | replace('.', ',') }} °C bleibt (zwischenzeitlich geändert).
                    {%- endif %}
                    {%- endif %}
              - sequence: !input notify_action
