blueprint:
  name: Aerosmart PV-Überschuss (SG-Box-Ersatz)
  description: >
    Speichert PV-Überschuss als Wärme – wie die Smart-Grid-Funktion der
    drexel-und-weiss SG-Box, nur mit einem Netz- oder Einspeise-Sensor aus
    Home Assistant statt dem Kontakt des Wechselrichters.


    **Überschuss** (Einspeisung über Leistungsaufnahme der Wärmepumpe plus
    Mindest-Einspeisung): liegt der Warmwasserspeicher unter der
    Starttemperatur, wird Brauchwasser-Soll auf die Ladetemperatur gesetzt
    (SG-Box: 55 °C ab unter 52 °C, gemessen am Fühler der Wärmepumpe). Optional wird Raum-Soll angehoben
    (SG-Box: 0,5–3 K), auch bei Niedertarif.

    **Kein Überschuss mehr** (Einspeisung unter der Mindest-Einspeisung):
    die vorherigen Sollwerte werden wiederhergestellt. Hat jemand den
    Sollwert in der Zwischenzeit geändert, bleibt dessen Wert stehen.


    Die vorherigen Sollwerte werden in Helfern gespeichert, damit sie einen
    Neustart überstehen. Vorher unter Einstellungen → Geräte & Dienste →
    Helfer je einen **Zahlenwert-Helfer** anlegen: Minimum 0, Maximum 100,
    Schrittweite 0,1, Anzeigemodus Eingabefeld. Einen für Brauchwasser und –
    falls Raum genutzt wird – einen für Raum. 0 bedeutet „keine Anhebung
    aktiv“.
  domain: automation
  source_url: https://github.com/kocher/ha-drexel-weiss-fernwartungsmodul/blob/main/blueprints/automation/drexel/pv_ueberschuss.yaml
  homeassistant:
    min_version: 2024.8.0
  input:
    surplus:
      name: Überschuss
      description: Wann gilt Strom als übrig?
      input:
        export_sensor:
          name: Netz- oder Einspeise-Sensor
          description: >
            Leistung am Netzanschluss in W, z. B. vom Smart Meter oder
            Wechselrichter. Wie das Vorzeichen zu lesen ist, legt „Einspeisung
            ist“ fest. Mit Batteriespeicher, der das Netz bei null hält, besser
            einen geglätteten Wert verwenden: Helfer „Statistik“,
            Statistikmerkmal „Zeitlich gewichteter Durchschnitt“, Maximalalter
            5 Minuten, Stichprobengröße leer, „Letzten Messwert behalten“ an.
            Sonst setzen kurze
            Einspeisespitzen beim Abschalten großer Verbraucher die
            Ausschaltverzögerung immer wieder zurück, und die Anhebung endet
            viel zu spät.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        export_sign:
          name: Einspeisung ist
          description: >
            Positiv bei einem reinen Einspeise-Sensor (0 bei Netzbezug).
            Negativ bei einem Netz-Sensor, der Bezug positiv und Einspeisung
            negativ anzeigt.
          default: "1"
          selector:
            select:
              options:
                - label: positiv (Einspeise-Sensor)
                  value: "1"
                - label: negativ (Netz-Sensor, Bezug positiv)
                  value: "-1"
        heat_pump_power:
          name: Leistungsaufnahme Wärmepumpe
          description: >
            Was die Wärmepumpe beim Heizen ungefähr aufnimmt, samt
            Ventilatoren. Angehoben wird erst, wenn so viel plus die
            Mindest-Einspeisung eingespeist wird – dann läuft die Wärmepumpe
            mit eigenem Strom.
            Vorgabe 500 W passt zur aerosmart m: max. 450 W laut Datenblatt,
            dazu die Ventilatoren.
          default: 500
          selector:
            number:
              min: 0
              max: 10000
              step: 10
              unit_of_measurement: W
              mode: box
        reserve:
          name: Mindest-Einspeisung
          description: >
            So viel soll trotz laufender Wärmepumpe noch eingespeist werden.
            Angehoben wird ab Leistungsaufnahme plus Mindest-Einspeisung,
            zurückgesetzt, sobald weniger als die Mindest-Einspeisung
            eingespeist wird. Ob die Wärmepumpe gerade läuft, wird dabei nicht
            geprüft. Mit einem Batteriespeicher, der das Netz bei null hält,
            nicht zu klein wählen – sonst versorgt er die Anhebung weiter.
          default: 300
          selector:
            number:
              min: 100
              max: 10000
              step: 10
              unit_of_measurement: W
              mode: box
        on_delay:
          name: Einschaltverzögerung
          description: >
            So lange muss die Einspeisung ununterbrochen über
            Leistungsaufnahme plus Mindest-Einspeisung liegen, bevor angehoben
            wird – auch wenn der Speicher während des Überschusses abkühlt,
            eine Bedingung erfüllt wird oder Home Assistant neu startet.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: min
        off_delay:
          name: Ausschaltverzögerung
          description: >
            So lange muss die Einspeisung ununterbrochen unter der
            Mindest-Einspeisung liegen, bevor die Sollwerte zurückgesetzt
            werden. Bei Wolken nicht zu kurz wählen.
          default: 15
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: min
        min_duration:
          name: Mindestdauer
          description: >
            So lange bleibt eine Anhebung mindestens bestehen, auch wenn der
            Überschuss vorher endet – das verhindert häufiges Ein- und
            Ausschalten, etwa wenn die Wärmepumpe mehr aufnimmt als
            angegeben. Zurückgesetzt wird danach, falls der Überschuss dann
            noch fehlt. 0 = aus.
          default: 30
          selector:
            number:
              min: 0
              max: 180
              unit_of_measurement: min
        cheap_rate:
          name: Niedertarif (optional)
          description: >
            Ist diese Entität „an“, wird Raum-Soll wie bei Überschuss
            angehoben, bei „aus“ zurückgesetzt (SG-Box-Eingang „Smart
            Meter“). Brauchwasser bleibt unverändert – auch die SG-Box gibt
            bei Niedertarif nur die normale Ladung frei, die die Wärmepumpe
            ohnehin macht. Leer lassen, wenn nicht vorhanden.
          default: ""
          selector:
            entity:
              filter:
                - domain: [binary_sensor, input_boolean, switch]
    water:
      name: Brauchwasser
      description: Boiler mit Überschuss aufheizen.
      input:
        water_heater:
          name: Brauchwasser
          description: Die Brauchwasser-Entität der Aerosmart (Wärmepumpe).
          selector:
            entity:
              filter:
                - domain: water_heater
                  integration: drexel
        tank_sensor:
          name: Speicherfühler (optional)
          description: >
            Temperatur, mit der Starttemperatur verglichen wird. Leer lassen,
            dann wird wie bei der SG-Box „Warmwasserspeicher WP“ (T_BW_WP) der
            Wärmepumpe verwendet. Der „Boiler“-Fühler oben im Speicher, den
            das Web-Interface anzeigt, ist meist wärmer und ändert sich beim
            Laden langsamer.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        water_helper:
          name: Helfer für den vorherigen Brauchwasser-Soll
          description: >
            Zahlenwert-Helfer (0–100, Schrittweite 0,1), in dem der
            Brauchwasser-Soll vor der Anhebung gespeichert wird. Nicht von Hand
            ändern; 0 heißt „keine Anhebung aktiv“.
          selector:
            entity:
              filter:
                - domain: input_number
        boost_temperature:
          name: Ladetemperatur
          description: >
            Auf diesen Brauchwasser-Soll wird bei Überschuss angehoben.
            SG-Box: 55 °C, das Maximum der Aerosmart.
          default: 55
          selector:
            number:
              min: 40
              max: 55
              unit_of_measurement: °C
        start_below:
          name: Starttemperatur
          description: >
            Nur anheben, wenn der Warmwasserspeicher kälter ist – sonst lohnt
            die Ladung nicht. Gemessen wird wie bei der SG-Box am Fühler der
            Wärmepumpe („Warmwasserspeicher WP“, T_BW_WP), nicht am Boiler-
            Fühler oben im Speicher. SG-Box: 52 °C.
          default: 52
          selector:
            number:
              min: 30
              max: 55
              unit_of_measurement: °C
    room:
      name: Raum (optional)
      description: Zusätzlich Wärme im Haus speichern.
      collapsed: true
      input:
        climate:
          name: Raum
          description: >
            Die Raum-Entität der Aerosmart (Raumbediengerät). Leer lassen, um
            Raum-Soll nicht anzuheben.
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
                  integration: drexel
        room_helper:
          name: Helfer für den vorherigen Raum-Soll
          description: >
            Zahlenwert-Helfer (0–100, Schrittweite 0,1), in dem der Raum-Soll
            vor der Anhebung gespeichert wird. Nur nötig, wenn Raum gewählt
            ist.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_number
        room_mode:
          name: Modus Smart Grid
          description: >
            Wobei Raum-Soll angehoben wird – wie der Parameter „Modus Smart
            Grid“ der SG-Box. Brauchwasser wird unabhängig davon nur bei
            PV-Überschuss geladen.
          default: both
          selector:
            select:
              options:
                - label: PV
                  value: pv
                - label: Niedertarif
                  value: cheap
                - label: PV oder Niedertarif
                  value: both
        room_raise:
          name: Anhebung
          description: >
            Um so viel wird Raum-Soll bei Überschuss erhöht, höchstens bis zum
            Maximum des Geräts. SG-Box: 0,5–3 K.
          default: 1
          selector:
            number:
              min: 0.5
              max: 3
              step: 0.5
              unit_of_measurement: K
        room_conditions:
          name: Bedingungen für Raum
          description: >
            Raum-Soll nur anheben, wenn alle diese Bedingungen erfüllt sind,
            z. B. Heizperiode, Außentemperatur unter 15 °C oder Fenster
            geschlossen. Brauchwasser wird davon nicht beeinflusst. Das
            Zurücksetzen prüft sie nicht. Werden sie während eines
            Überschusses erfüllt, wird spätestens nach 10 Minuten plus
            Einschaltverzögerung angehoben. Leer lassen für keine
            Einschränkung.
          default: []
          selector:
            condition: {}
    conditions:
      name: Zusätzliche Bedingungen (optional)
      description: Nur anheben, wenn diese Bedingungen erfüllt sind.
      collapsed: true
      input:
        raise_conditions:
          name: Bedingungen
          description: >
            Alle müssen erfüllt sein, damit angehoben wird, z. B. „Fenster
            geschlossen“, „jemand zu Hause“ oder ein Schalter, der die
            Automation pausiert. Das Zurücksetzen prüft sie nicht – eine
            Anhebung wird also immer beendet. Werden die Bedingungen während
            eines Überschusses erfüllt, wird spätestens nach 10 Minuten plus
            Einschaltverzögerung angehoben. Leer lassen für keine
            Einschränkung.
          default: []
          selector:
            condition: {}
    notification:
      name: Benachrichtigung (optional)
      description: Bescheid geben, wenn angehoben oder zurückgesetzt wird.
      collapsed: true
      input:
        notify_action:
          name: Benachrichtigung
          description: >
            Aktionen, die beim Anheben und Zurücksetzen ausgeführt werden.
            Vorbelegt ist eine Benachrichtigung in Home Assistant; über „⋮ →
            Aktion ändern“ z. B. das Telefon (`notify.mobile_app_…`) wählen.
            Titel und Nachricht stehen als `{{ title }}` und `{{ message }}`
            bereit – die Nachricht enthält Einspeisung, aktuelle Temperatur und
            Sollwerte. Alle Aktionen löschen für keine Benachrichtigung.
          default:
            - action: notify.persistent_notification
              data:
                title: "{{ title }}"
                message: "{{ message }}"
          selector:
            action: {}

mode: queued
max_exceeded: silent

trigger_variables:
  export_sensor: !input export_sensor
  cheap_rate: !input cheap_rate
  export_sign: !input export_sign
  heat_pump_power: !input heat_pump_power
  water_heater: !input water_heater
  climate: !input climate
  start_below: !input start_below
  tank_sensor_input: !input tank_sensor

trigger:
  # Export as a positive number, whatever the sensor's sign convention. An
  # unavailable sensor gives no number, so it neither starts nor stops.
  # Start once the heat pump would still leave the minimum export.
  - platform: numeric_state
    entity_id: !input export_sensor
    value_template: >
      {{ state.state | float * export_sign | int(1) - heat_pump_power | float(0)
         if state.state | is_number else none }}
    above: !input reserve
    for:
      minutes: !input on_delay
    id: start
  - platform: template
    value_template: "{{ cheap_rate != '' and is_state(cheap_rate, 'on') }}"
    id: start
  # The tank cooled down while the surplus continues. Like the SG-Box,
  # measured at the heat pump's sensor T_BW_WP (parameter 214).
  - platform: template
    value_template: >
      {%- set s = tank_sensor_input or device_entities(device_id(water_heater))
                  | select('is_state_attr', 'parameter_id', 214) | first | default('') -%}
      {%- set t = (states(s) if s else state_attr(water_heater, 'current_temperature')) | float(0) -%}
      {{ 0 < t < start_below }}
    id: delayed
  # Stop below the minimum export; whether the heat pump runs is not checked.
  - platform: numeric_state
    entity_id: !input export_sensor
    value_template: >
      {{ state.state | float * export_sign | int(1)
         if state.state | is_number else none }}
    below: !input reserve
    for:
      minutes: !input off_delay
    id: stop
  - platform: template
    value_template: "{{ cheap_rate != '' and is_state(cheap_rate, 'off') }}"
    id: stop
  # Everything needed is available again: after a restart or an outage of
  # the module or the export sensor. Catches up on raising and resetting.
  - platform: template
    value_template: >
      {{ states(export_sensor) | is_number
         and states(water_heater) not in ['unavailable', 'unknown']
         and (climate == '' or states(climate) not in ['unavailable', 'unknown']) }}
    id: check
  # Raise what conditions or missed triggers held back.
  - platform: time_pattern
    minutes: /10
    id: periodic

variables:
  reserve: !input reserve
  on_delay: !input on_delay
  min_duration: !input min_duration
  water_helper: !input water_helper
  boost_temperature: !input boost_temperature
  room_helper: !input room_helper
  room_raise: !input room_raise
  room_mode: !input room_mode
  use_room: "{{ climate != '' and room_helper != '' }}"
  # T_BW_WP like the SG-Box; the water heater shows the upper sensor.
  tank_sensor: >
    {{ tank_sensor_input or device_entities(device_id(water_heater))
       | select('is_state_attr', 'parameter_id', 214) | first | default('') }}
  # State at the time of the trigger; recomputed after every wait below.
  export_known: "{{ states(export_sensor) | is_number }}"
  export: "{{ (states(export_sensor) | float(0) * export_sign | int(1)) | round(0) | int }}"
  water_raised: "{{ states(water_helper) | float(0) > 0 }}"
  room_raised: "{{ use_room and states(room_helper) | float(0) > 0 }}"
  # While raised, the heat pump already uses its share (see triggers).
  surplus_threshold: >
    {{ reserve if water_raised or room_raised else reserve + heat_pump_power | float(0) }}
  cheap_on: "{{ cheap_rate != '' and is_state(cheap_rate, 'on') }}"
  pv_surplus: "{{ export_known and export > surplus_threshold }}"
  # Like "Modus Smart Grid"; hot water only ever on PV (SG-Box).
  room_active: >
    {{ (pv_surplus and room_mode in ['pv', 'both'])
       or (cheap_on and room_mode in ['cheap', 'both']) }}
  water_available: >
    {{ states(water_heater) not in ['unavailable', 'unknown']
       and state_attr(water_heater, 'temperature') is number }}
  room_available: >
    {{ use_room and states(climate) not in ['unavailable', 'unknown']
       and state_attr(climate, 'temperature') is number }}
  # 0 or unavailable means unknown.
  water_current: >
    {%- set t = (states(tank_sensor) if tank_sensor
                 else state_attr(water_heater, 'current_temperature')) | float(0) -%}
    {{ t if t > 0 else none }}
  can_raise_water: >
    {{ pv_surplus and not water_raised and water_available
       and water_current is number and water_current < start_below }}
  can_raise_room: "{{ room_active and not room_raised and room_available }}"
  # Resetting needs to know there is no surplus; unknown export waits.
  water_due: "{{ water_raised and export_known and not pv_surplus }}"
  room_due: >
    {{ room_raised and not room_active
       and (export_known or room_mode == 'cheap') }}

action:
  - choose:
      - alias: Überschuss – anheben
        conditions:
          - "{{ trigger.id in ['start', 'delayed', 'check', 'periodic'] }}"
          - "{{ can_raise_water or can_raise_room }}"
          # Raising only; the reset below ignores them.
          - condition: and
            conditions: !input raise_conditions
        sequence:
          # Anything but the export trigger itself: the surplus has to last
          # for the on delay as well; give up if it ends meanwhile.
          - if:
              - "{{ trigger.id != 'start' and on_delay | float(0) > 0 }}"
            then:
              - wait_for_trigger:
                  - platform: template
                    value_template: >
                      {%- set e = states(export_sensor) | float(0) * export_sign | int(1) -%}
                      {%- set pv = states(export_sensor) | is_number and e > surplus_threshold -%}
                      {%- set cheap = cheap_rate != '' and is_state(cheap_rate, 'on') -%}
                      {%- set room = (pv and room_mode in ['pv', 'both'])
                                     or (cheap and room_mode in ['cheap', 'both']) -%}
                      {{ not ((can_raise_water and pv) or (can_raise_room and room)) }}
                timeout:
                  minutes: "{{ on_delay }}"
                continue_on_timeout: true
              - if:
                  - "{{ wait.trigger is not none }}"
                then:
                  - stop: Überschuss während der Einschaltverzögerung beendet
          - variables: &now
              export_known: "{{ states(export_sensor) | is_number }}"
              export: "{{ (states(export_sensor) | float(0) * export_sign | int(1)) | round(0) | int }}"
              export_text: >
                {{ 'Einspeisung ' ~ export ~ ' W' if export >= 0
                   else 'Netzbezug ' ~ (-export) ~ ' W' }}
              water_raised: "{{ states(water_helper) | float(0) > 0 }}"
              room_raised: "{{ use_room and states(room_helper) | float(0) > 0 }}"
              surplus_threshold: >
                {{ reserve if water_raised or room_raised else reserve + heat_pump_power | float(0) }}
              cheap_on: "{{ cheap_rate != '' and is_state(cheap_rate, 'on') }}"
              pv_surplus: "{{ export_known and export > surplus_threshold }}"
              room_active: >
                {{ (pv_surplus and room_mode in ['pv', 'both'])
                   or (cheap_on and room_mode in ['cheap', 'both']) }}
              water_available: >
                {{ states(water_heater) not in ['unavailable', 'unknown']
                   and state_attr(water_heater, 'temperature') is number }}
              room_available: >
                {{ use_room and states(climate) not in ['unavailable', 'unknown']
                   and state_attr(climate, 'temperature') is number }}
              water_current: >
                {%- set t = (states(tank_sensor) if tank_sensor
                             else state_attr(water_heater, 'current_temperature')) | float(0) -%}
                {{ t if t > 0 else none }}
              water_target: "{{ state_attr(water_heater, 'temperature') | float(0) }}"
              room_current: "{{ state_attr(climate, 'current_temperature') if use_room else none }}"
              room_target: "{{ state_attr(climate, 'temperature') | float(0) if use_room else 0 }}"
              room_max: "{{ state_attr(climate, 'max_temp') | float(26) if use_room else 26 }}"
          - variables:
              raise_water: >
                {{ pv_surplus and not water_raised and water_available
                   and water_current is number and water_current < start_below }}
              raise_room: "{{ room_active and not room_raised and room_available }}"
              room_boost: "{{ [room_target + room_raise, room_max] | min }}"
          - if:
              - "{{ raise_water }}"
            then:
              - service: water_heater.set_temperature
                target:
                  entity_id: "{{ water_heater }}"
                data:
                  temperature: "{{ boost_temperature }}"
              # Only once the module took the new setpoint.
              - service: input_number.set_value
                target:
                  entity_id: "{{ water_helper }}"
                data:
                  value: "{{ water_target }}"
          - if:
              - "{{ raise_room }}"
              - condition: and
                conditions: !input room_conditions
            then:
              - service: climate.set_temperature
                target:
                  entity_id: "{{ climate }}"
                data:
                  temperature: "{{ room_boost }}"
              - service: input_number.set_value
                target:
                  entity_id: "{{ room_helper }}"
                data:
                  value: "{{ room_target }}"
          # The room conditions may have held raising back.
          - variables:
              room_done: "{{ raise_room and states(room_helper) | float(0) > 0 }}"
          - if:
              - "{{ raise_water or room_done }}"
            then:
              - variables:
                  title: Aerosmart – Überschuss
                  message: >
                    {%- set n = '%.1f' -%}
                    {{ export_text }}{{ ', Niedertarif' if cheap_on }}.
                    {%- if raise_water %}
                    Brauchwasser {{ (n | format(water_current) | replace('.', ',')) if water_current is number else '?' }} °C,
                    Soll {{ water_target | round(1) | string | replace('.', ',') }} → {{ boost_temperature | round(1) | string | replace('.', ',') }} °C.
                    {%- endif %}
                    {%- if room_done %}
                    Raum {{ (n | format(room_current | float(0))) | replace('.', ',') }} °C,
                    Soll {{ room_target | round(1) | string | replace('.', ',') }} → {{ room_boost | round(1) | string | replace('.', ',') }} °C.
                    {%- endif %}
              - sequence: !input notify_action
      - alias: Kein Überschuss – zurücksetzen
        conditions:
          - "{{ trigger.id in ['stop', 'check'] }}"
          - "{{ water_due or room_due }}"
        sequence:
          # A boost lasts at least the minimum duration (since the helper
          # was set, or since the last restart).
          - variables:
              remaining: >
                {%- set ns = namespace(r=0) -%}
                {%- for due, helper in [(water_due, water_helper), (room_due, room_helper)] if due -%}
                  {%- set age = (now() - states[helper].last_changed).total_seconds() -%}
                  {%- set ns.r = [ns.r, min_duration | float(0) * 60 - age] | max -%}
                {%- endfor -%}
                {{ ns.r | round(0) | int }}
          - if:
              - "{{ remaining > 0 }}"
            then:
              - delay:
                  seconds: "{{ remaining }}"
          - variables: *now
          - variables:
              water_due: "{{ water_raised and export_known and not pv_surplus }}"
              room_due: >
                {{ room_raised and not room_active
                   and (export_known or room_mode == 'cheap') }}
          # Unavailable: keep the helper, the "check" trigger retries.
          - variables:
              reset_water: "{{ water_due and water_available }}"
              reset_room: "{{ room_due and room_available }}"
              # Only restore if nobody changed the setpoint meanwhile.
              water_before: "{{ states(water_helper) | float(0) }}"
              room_before: "{{ states(room_helper) | float(0) if use_room else 0 }}"
              restore_water: >
                {{ reset_water and (water_target - boost_temperature) | abs < 0.1 }}
              restore_room: >
                {{ reset_room
                   and (room_target - [room_before + room_raise, room_max] | min) | abs < 0.05 }}
          - if:
              - "{{ restore_water }}"
            then:
              - service: water_heater.set_temperature
                target:
                  entity_id: "{{ water_heater }}"
                data:
                  temperature: "{{ water_before }}"
          - if:
              - "{{ reset_water }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: "{{ water_helper }}"
                data:
                  value: 0
          - if:
              - "{{ restore_room }}"
            then:
              - service: climate.set_temperature
                target:
                  entity_id: "{{ climate }}"
                data:
                  temperature: "{{ room_before }}"
          - if:
              - "{{ reset_room }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: "{{ room_helper }}"
                data:
                  value: 0
          - if:
              - "{{ reset_water or reset_room }}"
            then:
              - variables:
                  title: Aerosmart – kein Überschuss mehr
                  message: >
                    {%- set n = '%.1f' -%}
                    {{ export_text }}.
                    {%- if reset_water %}
                    Brauchwasser {{ (n | format(water_current) | replace('.', ',')) if water_current is number else '?' }} °C,
                    {% if restore_water -%}
                    Soll {{ water_target | round(1) | string | replace('.', ',') }} → {{ water_before | round(1) | string | replace('.', ',') }} °C.
                    {%- else -%}
                    Soll {{ water_target | round(1) | string | replace('.', ',') }} °C bleibt (zwischenzeitlich geändert).
                    {%- endif %}
                    {%- endif %}
                    {%- if reset_room %}
                    Raum {{ (n | format(room_current | float(0))) | replace('.', ',') }} °C,
                    {% if restore_room -%}
                    Soll {{ room_target | round(1) | string | replace('.', ',') }} → {{ room_before | round(1) | string | replace('.', ',') }} °C.
                    {%- else -%}
                    Soll {{ room_target | round(1) | string | replace('.', ',') }} °C bleibt (zwischenzeitlich geändert).
                    {%- endif %}
                    {%- endif %}
              - sequence: !input notify_action
